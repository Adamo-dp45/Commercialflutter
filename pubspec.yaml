name: commercialflutter
description: "Application mobile du commercial à bord — iTransport."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # État & injection de dépendances
  flutter_riverpod: ^3.3.2

  # Réseau
  dio: ^5.10.0

  # Navigation déclarative
  go_router: ^17.3.0

  # Localisation fr (dates / nombres)
  intl: ^0.20.3 # version exigée par 'flutter_localizations' du SDK Flutter courant
  flutter_localizations:
    sdk: flutter

  # Modèles immuables
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Stockage sécurisé des jetons (Keychain iOS / Keystore Android)
  flutter_secure_storage: ^9.2.4

  # Reçu du billet : génération PDF + partage / aperçu impression
  pdf: ^3.13.0
  printing: ^5.15.0

  # ── Vente hors ligne ──
  # Base locale : la file d'opérations et les instantanés de voyage. Premier stockage métier du
  # projet — jusqu'ici seuls les jetons étaient persistés (flutter_secure_storage).
  sqflite: ^2.4.2
  path: ^1.9.1
  # Sans détection de réseau, l'app ne peut pas décider d'elle-même de basculer en file d'attente.
  connectivity_plus: ^7.0.0
  # Référence d'idempotence de chaque opération : c'est elle qui rend un lot rejouable sans doublon.
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Génération de code (*.freezed.dart / *.g.dart)
  # sqflite vise Android/iOS ; en test, l'implémentation FFI fournit le même SQLite sur le poste.
  sqflite_common_ffi: ^2.3.6
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
