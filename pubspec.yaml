name: commercialflutter
description: "Application mobile du commercial à bord — iTransport."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # État & injection de dépendances
  flutter_riverpod: ^3.3.2

  # Réseau
  dio: ^5.10.0

  # Navigation déclarative
  go_router: ^17.3.0

  # Localisation fr (dates / nombres)
  intl: 0.20.2
  flutter_localizations:
    sdk: flutter

  # Modèles immuables
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Stockage sécurisé des jetons (Keychain iOS / Keystore Android)
  flutter_secure_storage: ^9.2.4

  # Reçu du billet : génération PDF + partage / aperçu impression
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Génération de code (*.freezed.dart / *.g.dart)
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
